name: Deploy install site (GitHub Pages)

# Install page updates on every push — no wait for Render.
on:
  push:
    branches: [main]
    paths:
      - "public/install/**"
      - ".github/workflows/pages-install.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-install
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site root
        run: |
          mkdir -p _site
          cp -a public/install/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
